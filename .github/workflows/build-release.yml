name: Build and Release SailHighSea TorrentSearch

# Tauri 2 app for Windows, Linux, macOS and Android.
#   push to main   -> stable release   (v0.0.1, v0.0.2, ...)
#   push to dev    -> pre-release      (v0.0.1-dev-1, v0.0.1-dev-2, ...)
#   push of v* tag -> release for that tag
#   pull request   -> build + tests only
#   Run workflow   -> build + tests only (Actions tab > Run workflow)
on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One run per branch at a time, so two quick pushes cannot race for the same release tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Work out version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      number: ${{ steps.v.outputs.number }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        run: |
          TAG=$(bash scripts/next-version.sh "$GITHUB_REF")
          NUM="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          # Android versionCode must always go up: patch * 1000 + (999 for a stable release, N for -dev-N), so a stable
          # release replaces its own dev builds and the next patch replaces both.
          PATCH=$(echo "$NUM" | sed -E 's/^[0-9]+\.[0-9]+\.([0-9]+).*/\1/')
          DEV=$(echo "$NUM" | sed -nE 's/.*-dev-([0-9]+)$/\1/p')
          echo "code=$(( PATCH * 1000 + ${DEV:-999} ))" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG"

  # Rust and frontend tests, once, before any bundling.
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest,  bundles: nsis }
          # Native Windows on ARM. Experimental: if this job fails the release still goes out without it.
          - { name: windows-arm64, os: windows-11-arm,  bundles: nsis, experimental: true }
          - { name: linux-x64,     os: ubuntu-22.04,    bundles: 'appimage,deb' }
          - { name: macos-arm64,   os: macos-latest,    bundles: 'app,dmg' }
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci

      # The release version goes into the app (About page, update check) and the installers.
      - name: Version
        run: node -e "require('fs').writeFileSync('src-tauri/tauri.ci.json', JSON.stringify({version:'${{ needs.version.outputs.number }}'}))"

      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.ci.json

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "release/SailHighSea-TorrentSearch-${{ matrix.name }}-setup.exe"
          # portable: the program plus a marker file; data then lives in a data/ folder next to it
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item src-tauri/target/release/sailhighsea-torrentsearch.exe portable/SailHighSea-TorrentSearch.exe
          New-Item portable/portable.txt -ItemType File -Value "Delete this file to use the normal app data folder instead.`n" | Out-Null
          Compress-Archive -Path portable/* -DestinationPath "release/SailHighSea-TorrentSearch-${{ matrix.name }}-portable.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release portable
          cp src-tauri/target/release/bundle/deb/*.deb "release/SailHighSea-TorrentSearch-${{ matrix.name }}.deb"
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$APPIMAGE"
          cp "$APPIMAGE" "release/SailHighSea-TorrentSearch-${{ matrix.name }}.AppImage"
          # portable: the AppImage plus a marker file in the same folder
          cp "$APPIMAGE" portable/SailHighSea-TorrentSearch.AppImage
          echo "Delete this file to use the normal app data folder instead." > portable/portable.txt
          tar -czf "release/SailHighSea-TorrentSearch-${{ matrix.name }}-portable.tar.gz" -C portable .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release portable
          cp src-tauri/target/release/bundle/dmg/*.dmg "release/SailHighSea-TorrentSearch-${{ matrix.name }}.dmg"
          # portable: the .app plus a marker file next to it; data then lives in a data/ folder beside the bundle
          cp -R src-tauri/target/release/bundle/macos/*.app portable/
          echo "Delete this file to use the normal app data folder instead." > portable/portable.txt
          (cd portable && zip -r -y "../release/SailHighSea-TorrentSearch-${{ matrix.name }}-portable.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: SailHighSea-TorrentSearch-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  android:
    name: Android
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci

      - name: Version
        run: node -e "require('fs').writeFileSync('src-tauri/tauri.ci.json', JSON.stringify({version:'${{ needs.version.outputs.number }}', bundle:{android:{versionCode:${{ needs.version.outputs.code }}}}}))"

      # The Android project is generated here instead of being committed; the script adds the magnet: queries entry and the signing config.
      - name: Generate and patch the Android project
        run: |
          npx tauri android init --ci
          python3 scripts/android-patch.py src-tauri/gen/android

      - name: Keystore
        if: env.HAVE_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # With a keystore: signed release APK. Without one (pull requests, forks): a debug APK, so the build is still proven.
      - name: Build APK
        run: |
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            npx tauri android build --apk --config src-tauri/tauri.ci.json
          else
            npx tauri android build --apk --debug --config src-tauri/tauri.ci.json
          fi

      - name: Collect
        run: |
          mkdir release
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "no APK produced"; exit 1; }
          if [ "$HAVE_KEYSTORE" = "true" ]; then NAME=SailHighSea-TorrentSearch-android.apk; else NAME=SailHighSea-TorrentSearch-android-debug.apk; fi
          cp "$APK" "release/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: SailHighSea-TorrentSearch-android
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, desktop, android]
    # The desktop builds must have succeeded (Windows ARM64 is experimental and may lose its own job). Android is optional:
    # if its job fails, is skipped, or has no signing keystore, the release still goes out with whatever was built.
    if: github.event_name == 'push' && !cancelled() && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # An unsigned (debug) APK is not published.
      - name: Drop unsigned APK
        run: rm -f release/*-debug.apk

      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SailHighSea TorrentSearch ${{ needs.version.outputs.tag }}
          # The pushed commit's message (title + description) goes first; GitHub's generated notes (PR list and the
          # "Full Changelog" link) are appended. Direct pushes have no PRs, so without this the notes were just the link.
          body: ${{ github.event.head_commit.message }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
